# Game Dev Story (NextOS port) — experiment knobs.
# Loaded by loader2 as environment DEFAULTS every launch; '#' = comment.
# Edit this file on the device (ssh) and relaunch — no redeploy needed.

# Tablet mode. 1 (default, verified since 0.82) = the game unlocks its
# rotation/landscape toggle and tablet UI. 0 = phone mode: test whether
# the small bottom tab buttons grow (tablet layouts assume a big panel).
#GDS_TABLET=0

# Audio shim. Comment out to silence FMOD entirely (0.78 behavior).
#GDS_AUDIO=0

# Audio pitch A/B (0.86): if music sounds high-pitched/chipmunk, try one of
# these at a time, relaunch, and report which (if any) sounds correct:
#GDS_FMOD_RATE=22050
#GDS_FMOD_CH=1

# UI scale (0.87): overrides every density answer (DisplayMetrics + Unity
# Screen.dpi).  Physical panel is ~230dpi, default metrics are 240/1.5f,
# Screen.dpi was 160.  Try 240, then 320; watch the bottom tab buttons.
#GDS_DPI=240

# Trap probes (0.87): arms the brk probe table (exception stubs, form-flow
# stage markers, Main.catch decoder).  Logs get [trap] lines that name the
# exact step that fails.  Leave on for the error-dialog hunt.
#GDS_TRAP_AT=1
